<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bug Killer 浏览器采集 Demo - 首页</title>
</head>
<body>
  <h1>首页</h1>
  <p>2 秒后自动跳转到详情页，用于验证跳转前的日志不会丢失。</p>
  <script>
    const item = { id: "E-1", name: "输液泵", status: "available" }
    console.log("首页加载完成", item)
    console.log("首页埋点位置：item 与数组参数", item, [1, 2, 3])

    setTimeout(() => {
      console.log("跳转前：准备进入详情页")
      console.warn("跳转前：这是一条警告日志")
      window.location.href = "page2.html"
    }, 2000)
  </script>
</body>
</html>
